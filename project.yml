name: TextForge
options:
  minimumXcodeGenVersion: 2.45.0
  defaultConfig: Debug
packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: 2.4.1
settings:
  base:
    SWIFT_VERSION: 6.0
targets:
  TextForge:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TextForge
        excludes:
          - WidgetsStub
    dependencies:
      - target: TextForgeWidgets
        embed: true
      - package: MarkdownUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ishassan.TextForge
        TARGETED_DEVICE_FAMILY: 1
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: TextForge/App/Info.plist
  TextForgeWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TextForge/WidgetsStub
      - path: TextForge/DesignSystem
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ishassan.TextForge.widgets
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: TextForge/WidgetsStub/Info.plist
  TextForgeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - TextForgeTests/iOS
    dependencies:
      - target: TextForge
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TextForge:
    build:
      targets:
        TextForge: all
        TextForgeWidgets: [run, test]
        TextForgeTests: [test]
    test:
      targets:
        - name: TextForgeTests
